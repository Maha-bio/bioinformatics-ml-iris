project:
  name: "Bioinformatics AI/ML - Iris Classification"
  random_state: 42

data:
  test_size: 0.20
  stratify: true

models:
  logistic_regression:
    enabled: true
    max_iter: 200

  decision_tree:
    enabled: true
    max_depth: 5

  random_forest:
    enabled: true
    n_estimators: 100
    max_depth: 5

  svm:
    enabled: true
    kernel: "rbf"
    C: 1.0

  knn:
    enabled: true
    n_neighbors: 5

  gradient_boosting:
    enabled: true
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3

output:
  model_dir: "models"
  metrics_file: "results/metrics/model_metrics.csv"
  figures_dir: "results/figures"